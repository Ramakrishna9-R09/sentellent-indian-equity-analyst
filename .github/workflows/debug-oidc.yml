name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" > /tmp/oidc-token.txt
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          echo "SUB=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r .sub)"
          echo "AUD=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r .aud)"
          echo "ISS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r .iss)"
          echo "NBF=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r .nbf)"
          echo "TOKEN_LENGTH=${#TOKEN}"
      - name: Try assume role
        run: |
          TOKEN=$(cat /tmp/oidc-token.txt)
          aws sts assume-role-with-web-identity \
            --role-arn "$AWS_ROLE_ARN" \
            --role-session-name debug \
            --web-identity-token "$TOKEN" \
            --output json 2>&1 | head -40
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
